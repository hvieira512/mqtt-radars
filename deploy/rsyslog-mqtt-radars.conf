# Instala-se em /etc/rsyslog.d/10-mqtt-radars.conf.
#
# O Logger do subscritor escreve uma linha por mensagem de radar para o stdout,
# o systemd encaminha-a para o journal, e o rsyslog copia tudo o que seja
# `*.info` para o /var/log/messages. Ficam duas cópias das mesmas linhas: a do
# journal, travada em 1 GB pelo SystemMaxUse, e a do /var/log/messages, travada
# em nada. Na máquina antiga a segunda chegou a 35 GB.
#
# Esta regra corta a segunda cópia. As linhas continuam todas no journal, e
# continuam a ler-se com `journalctl -u mqtt-worker`.
#
# Tem de ser lida antes das regras do rsyslog.conf, e é: o
# `include(file="/etc/rsyslog.d/*.conf")` está antes da secção RULES.
#
# O `programname` é `php` porque as unidades correm `/usr/bin/php`. Se algum dia
# outro serviço em PHP passar a correr nesta máquina, esta regra também o
# silencia no /var/log/messages — e é por isso que o filtro fica assim, e não
# mais largo.
if $programname == "php" then stop
