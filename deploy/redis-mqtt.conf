# Sobreposições ao redis.conf do pacote. Instala-se em /etc/redis/mqtt.conf e é
# incluído no fim do redis.conf, onde a última diretiva ganha.
#
# O `noeviction` é a que importa: com uma política de expulsão, um Redis a
# encher descartaria mensagens em fila sem erro nenhum, e a perda só apareceria
# como um lote que a plataforma do cliente nunca recebeu. Com `noeviction`, a
# escrita falha e o consumidor dá erro — que é o comportamento que se quer.
maxmemory 4gb
maxmemory-policy noeviction
