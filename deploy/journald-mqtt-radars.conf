# Instala-se em /etc/systemd/journald.conf.d/10-mqtt-radars.conf.
#
# Por omissão o journald usa até 10% do sistema de ficheiros, o que num disco de
# 97 GB são cerca de 9,7 GB. O subscritor escreve uma linha por mensagem de
# radar, e desde que o rsyslog-mqtt-radars.conf corta a cópia para o
# /var/log/messages, o journal passou a ser o único sítio onde essas linhas
# ficam — e por isso o teto deixou de ser detalhe.
#
# 1 GB é o valor com que a máquina antiga corria, e dá vários dias de histórico
# ao ritmo a que os radares publicam.
#
# É um drop-in em vez de uma alteração ao journald.conf: uma atualização do
# systemd substitui o ficheiro do pacote, e não o que está no .conf.d.
[Journal]
SystemMaxUse=1G
