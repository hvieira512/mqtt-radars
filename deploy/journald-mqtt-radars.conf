# Instala-se em /etc/systemd/journald.conf.d/10-mqtt-radars.conf.
#
# O journal é o único sítio onde ficam as linhas do subscritor e dos
# consumidores. Por omissão cresce até 10% do sistema de ficheiros, o que num
# disco de 24 GB são perto de 2,4 GB — e num disco desse tamanho isso chega para
# incomodar.
#
# 1 GB dá vários dias de histórico ao ritmo a que os radares publicam.
#
# É um drop-in em vez de uma alteração ao journald.conf: uma atualização do
# systemd substitui o ficheiro do pacote, e não o que está no .conf.d.
[Journal]
SystemMaxUse=1G
