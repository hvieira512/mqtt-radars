# Configuração do broker de produção.
#
# É o conteúdo efetivo do que corria na máquina antiga, na mesma ordem. O
# ficheiro do pacote tem 900 linhas de comentários e nove de configuração.
#
# A ordem não é cosmética: no mosquitto, uma opção que apareça depois de um
# `listener` pode ligar-se a esse listener em vez de ser global. Reordenar isto
# para ficar mais bonito arrisca mudar a que listener a autenticação se aplica,
# e essa não é uma experiência para fazer num broker com dispositivos ligados.

# MQTT em claro. É aqui que se ligam os radares, os gateways e as duas
# instâncias do hub, todos com o endereço gravado na própria configuração.
listener 1883

# Sem isto, qualquer um publica em nome de qualquer dispositivo.
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# O `all` é o que permite reconstruir quem se ligou e a que tópicos. Escreve
# cerca de 3 GB por dia, e por isso a rotação em logrotate.d/mosquitto não é
# opcional.
log_dest file /var/log/mosquitto/mosquitto.log
log_type all

# WebSockets com TLS, para quem se liga do navegador.
listener 9001
protocol websockets
certfile /etc/letsencrypt/live/mqtt.havicare.net/fullchain.pem
keyfile /etc/letsencrypt/live/mqtt.havicare.net/privkey.pem

# Sem `persistence`: o broker não guarda sessões nem mensagens em disco, e um
# reinício descarta o que estiver em fila para um subscritor offline. É o
# comportamento da máquina antiga, mantido de propósito — a fila que interessa
# é a do Redis, do lado dos consumidores.
